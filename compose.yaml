name: swarm-hunter

services:
  swarm-hunter:
    build: .
    image: swarm-hunter:latest
    environment:
      HUNTER_ACCESS_TOKEN: ${HUNTER_ACCESS_TOKEN:?Set HUNTER_ACCESS_TOKEN (16+ characters) in .env or your shell}
      HUNTER_SECURE_COOKIE: ${HUNTER_SECURE_COOKIE:-0}
      HUNTER_GEO: ${HUNTER_GEO:-on}
    ports:
      - "${HUNTER_BIND:-127.0.0.1}:43124:43124"
    volumes:
      - hunter-data:/app/data
    restart: unless-stopped
    mem_limit: 512m

volumes:
  hunter-data:
