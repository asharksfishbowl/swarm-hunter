name: swarm-milker

services:
  swarm-milker:
    build: .
    image: swarm-milker:latest
    environment:
      MILKER_ACCESS_TOKEN: ${MILKER_ACCESS_TOKEN:?Set MILKER_ACCESS_TOKEN (16+ characters) in .env or your shell}
      MILKER_SECURE_COOKIE: ${MILKER_SECURE_COOKIE:-0}
      MILKER_GEO: ${MILKER_GEO:-on}
    ports:
      - "${MILKER_BIND:-127.0.0.1}:43124:43124"
    volumes:
      - milker-data:/app/data
    restart: unless-stopped
    mem_limit: 512m

volumes:
  milker-data:
