name: Deploy to Azure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'swarm-hunter' }}
  APP_NAME: ${{ vars.AZURE_APP_NAME || 'swarm-hunter-pmblkqihvsq2q' }}
  REGISTRY: ${{ vars.AZURE_REGISTRY || 'swarmhunterpmblkqihvsq2q' }}
  IMAGE: swarm-hunter

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Typecheck, lint and build the console
        working-directory: web
        run: |
          npm ci
          npx oxlint src
          npm run build

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Test the server
        working-directory: server
        run: cargo test --locked

      - name: Check the reader
        run: python3 -m py_compile watch/quarantine.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.release.outputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure (OpenID Connect, no stored password)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        run: az acr login --name "$REGISTRY"

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}.azurecr.io/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}.azurecr.io/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point the web app at the new image
        id: release
        run: |
          az webapp config set --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" \
            --linux-fx-version "DOCKER|$REGISTRY.azurecr.io/$IMAGE:$GITHUB_SHA" --output none
          host="$(az webapp show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query defaultHostName -o tsv)"
          echo "url=https://$host" >> "$GITHUB_OUTPUT"

      - name: Wait for the new version to answer
        run: |
          url="${{ steps.release.outputs.url }}"
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 10 "$url/api/health" >/dev/null; then
              echo "Live: $url ($GITHUB_SHA)"
              exit 0
            fi
            sleep 15
          done
          echo "The site did not answer within 10 minutes. Check: az webapp log tail -g $RESOURCE_GROUP -n $APP_NAME" >&2
          exit 1
